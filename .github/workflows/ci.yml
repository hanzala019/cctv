name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run rather than
# queueing behind it -- on a small team the runner minutes matter more
# than results for a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Fast feedback. No heavy dependencies, so this finishes in well
  # under a minute and catches the majority of review nits before a
  # human ever looks at the diff.
  # ------------------------------------------------------------------
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.4

      - name: Ruff (lint + import order)
        run: ruff check --output-format=github .

      - name: Import cycles and layering
        # Pure AST parsing -- deliberately needs no project dependencies,
        # so it runs here rather than in the test job.
        run: python scripts/check_imports.py

  # ------------------------------------------------------------------
  # Full test run, including headless GUI construction.
  # ------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel 3.13 just because 3.12 failed -- knowing whether a
      # failure is version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Qt runtime libraries
        # PyQt6 wheels bundle Qt itself but still link against these
        # system libraries. ubuntu-latest ships most of them; libegl1 is
        # the one that is reliably missing and produces the classic
        # "could not load the Qt platform plugin" failure.
        #
        # If Qt ever fails to load after a runner image update, this is
        # the first place to look -- run the failing job with
        # QT_DEBUG_PLUGINS=1 to see which library is missing.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Offscreen Qt, and a scratch data directory so nothing is
          # written next to the checkout.
          QT_QPA_PLATFORM: offscreen
          CCTV_DATA_DIR: ${{ runner.temp }}/cctv-data
        run: |
          pytest -q \
            --cov=core \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=40

      - name: Coverage summary
        if: always()
        run: |
          echo "Coverage floor is 40%, deliberately just below current." >> $GITHUB_STEP_SUMMARY
          echo "Raise it whenever real coverage climbs -- it should" >> $GITHUB_STEP_SUMMARY
          echo "ratchet up and never down. See GUIDELINE.md section 12." >> $GITHUB_STEP_SUMMARY

      - name: Check nothing was written outside the data directory
        # The app creates its databases on first use. If a path
        # regression puts them back inside the package tree (as happened
        # during the package restructure), this catches it here rather
        # than on someone's machine.
        run: |
          if git status --porcelain | grep -q .; then
            echo "::error::Test run left untracked or modified files:"
            git status --porcelain
            exit 1
          fi
          echo "working tree clean"
